<!-- Projects Section -->
<section id="projects" class="content-section">
    <h2 class="section-header" data-i18n="projects.title">Projects</h2>
    <p class="section-subtitle" data-i18n="projects.subtitle">A collection of my recent work and personal projects.</p>

    <div class="projects-grid" id="projectsGrid">
        <!-- Projects will be dynamically loaded here -->
    </div>

    <!-- Archive: older personal projects below a divider -->
    <div class="projects-archive">
        <h3 class="projects-archive-title" data-i18n="projects.archiveTitle">Archive</h3>
        <p class="projects-archive-note" data-i18n="projects.archiveNote"></p>
        <div class="projects-grid projects-grid-archive" id="projectsArchiveGrid"></div>
    </div>
    <p class="projects-ai-note" data-i18n="projects.aiNote"></p>
</section>

<!-- Project Modal -->
<div class="modal-overlay" id="projectModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-image" id="modalImage"></div>
            <button class="modal-close" onclick="closeProjectModal()">×</button>
        </div>
        <div class="modal-content">
            <h2 class="modal-title" id="modalTitle">Project Title</h2>
            <p class="modal-tech" id="modalTech">Technologies Used</p>
            <p class="modal-description" id="modalDescription">Project description goes here...</p>
            
            <div class="modal-features">
                <h4 data-i18n="projects.featuresLabel">Key Features</h4>
                <ul class="features-list" id="modalFeatures">
                    <!-- Features will be dynamically loaded here -->
                </ul>
            </div>

            <div class="modal-links" id="modalLinks">
                <!-- Links will be dynamically loaded here -->
            </div>
        </div>
    </div>
</div>
