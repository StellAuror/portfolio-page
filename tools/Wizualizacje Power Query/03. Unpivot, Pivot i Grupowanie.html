<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unpivot, Pivot i grupowanie</title>
    <link rel="stylesheet" href="../viz/kit.css">
    <style>
        /* kolory miesięcy i produktów: tylko do śledzenia, gdzie trafiła komórka */
        .c-Sty { --mc: #4f46e5; --ms: #ecebff; }
        .c-Lut { --mc: #db2777; --ms: #fde8f2; }
        .c-Mar { --mc: #0d9488; --ms: #dcf5f2; }
        .c-Rower { --mc: #2563eb; --ms: #e8efff; }
        .c-Kask { --mc: #d97706; --ms: #fff3e0; }
        .c-Bidon { --mc: #059669; --ms: #e3f6ef; }

        .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
        .bar .count { font-size: 13px; color: var(--text-3); min-width: 82px; text-align: center; font-variant-numeric: tabular-nums; }
        .bar .spacer { flex: 1; }
        .bar label { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--text-2); cursor: pointer; }
        .bar label[hidden] { display: none; }
        .bar label input { accent-color: var(--brand); width: 16px; height: 16px; }

        .caption {
            min-height: 44px;
            font-size: 14.5px;
            line-height: 1.7;
            background: var(--surface);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            margin-bottom: 14px;
        }
        .caption .mono { font-family: var(--mono); font-size: 13px; }
        .caption .pill { display: inline-block; border-radius: 5px; padding: 0 6px; font-weight: 700; background: var(--ms); color: var(--mc); }

        .flow {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            gap: 14px;
            align-items: start;
        }
        .flow h3 { font-size: 13px; font-weight: 700; margin-bottom: 6px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
        .flow h3 .vz-hint { font-weight: 400; }
        .flow .arrow {
            align-self: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-3);
            font-size: 26px;
            line-height: 1;
        }
        .flow .arrow span { font-family: var(--mono); font-size: 11px; color: var(--brand); font-weight: 700; writing-mode: vertical-rl; transform: rotate(180deg); }

        .rt td, .rt th { transition: background .25s, box-shadow .25s, opacity .25s; }
        .rt td.val { font-weight: 600; }
        .rt td.mc, .rt th.mc { background: var(--ms); color: var(--mc); }
        .rt th.mc { box-shadow: inset 0 -2px 0 var(--mc); }
        .rt td.used { opacity: .45; }
        .rt td.active, .rt th.active { box-shadow: inset 0 0 0 2px var(--mc, var(--text)); opacity: 1; }
        .rt td.nullcell .null { color: var(--text-3); font-style: italic; font-weight: 400; }
        .rt td.skip .null { text-decoration: line-through; }
        .rt td .tag { font-size: 10.5px; font-weight: 700; color: var(--bad); margin-left: 6px; text-transform: uppercase; letter-spacing: .03em; }
        .rt th.newcol { color: var(--text); }
        .rt th.newcol small { display: block; font-size: 10px; color: var(--text-3); text-transform: none; letter-spacing: 0; font-weight: 400; }
        .rt td.pend { background: none !important; box-shadow: none !important; }
        .rt td.pend .v, .rt th.pend .v { visibility: hidden; }
        .rt tr.pend-row td { border-bottom-style: dashed; }
        .rt .landing .v, .rt .v.landing { visibility: hidden; }
        .rt td .sub { display: block; font-size: 10.5px; color: var(--text-3); font-weight: 400; }
        .rt td.flash { animation: flash .7s var(--ease); }
        @keyframes flash { from { box-shadow: inset 0 0 0 2px var(--mc, var(--text)); } }

        .grp-chips { display: flex; flex-wrap: wrap; gap: 4px; }
        .grp-chips .v { display: inline-block; border-radius: 5px; padding: 0 6px; font-size: 12.5px; font-weight: 600; background: var(--ms); color: var(--mc); line-height: 20px; }
        .rt td.sub-col { font-family: var(--mono); background: var(--surface); border-left: 1px dashed var(--line-strong); white-space: normal; min-width: 110px; }
        .rt th.sub-col { font-family: var(--mono); text-transform: none; letter-spacing: 0; color: var(--ctx-row); border-left: 1px dashed var(--line-strong); }

        .ghost {
            position: absolute;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 13.5px;
            font-weight: 700;
            background: var(--ms, var(--surface-2));
            color: var(--mc, var(--text));
            border: 2px solid var(--mc, var(--text-2));
            box-shadow: 0 6px 18px rgba(0,0,0,.18);
            pointer-events: none;
            white-space: nowrap;
            overflow: hidden;
            transition: transform .62s var(--ease), width .62s var(--ease), height .62s var(--ease), opacity .2s;
        }

        .mono { font-family: var(--mono); font-size: 12.5px; }
        .vz-step-note code, .vz-takeaway code, .vz-step-title code { font-family: var(--mono); font-size: 12.5px; background: rgba(0,0,0,.05); border-radius: 4px; padding: 0 4px; }
        .list-eq { font-family: var(--mono); font-size: 12.5px; background: var(--ctx-row-soft); border-radius: var(--radius-sm); padding: 6px 8px; margin-top: 8px; display: grid; gap: 2px; }

        @media (max-width: 820px) {
            .flow { grid-template-columns: minmax(0, 1fr); }
            .flow .arrow { flex-direction: row; font-size: 22px; transform: none; }
            .flow .arrow b { transform: rotate(90deg); display: inline-block; }
            .flow .arrow span { writing-mode: horizontal-tb; transform: none; }
            .bar .spacer { display: none; }
            .caption { font-size: 13.5px; }
        }
        @media (max-width: 520px) {
            .rt th.newcol small { display: none; }
            .rt td.sub-col { min-width: 0; }
            .rt th, .rt td { padding-left: 6px; padding-right: 6px; }
        }
    </style>
</head>
<body>
<div class="vz-app">
    <header class="vz-head">
        <div class="vz-kicker">Power Query · Przekształcanie tabel</div>
        <h1 class="vz-title">Unpivot, Pivot i grupowanie</h1>
        <p class="vz-lead">Trzy funkcje, które zmieniają kształt tabeli. Każda komórka ma kolor, więc widać, dokąd trafia: z nagłówka do wiersza, z wiersza do nagłówka albo z wielu wierszy do jednej grupy.</p>
    </header>

    <div id="tabs"></div>
    <div class="vz-code" id="code"></div>

    <section class="vz-card">
        <div class="bar">
            <button type="button" class="vz-btn primary" id="playBtn">▶ Odtwórz</button>
            <button type="button" class="vz-btn" id="prevBtn" aria-label="Poprzedni krok">←</button>
            <span class="count" id="count"></span>
            <button type="button" class="vz-btn" id="nextBtn" aria-label="Następny krok">→</button>
            <button type="button" class="vz-btn" id="endBtn">Pokaż wynik</button>
            <span class="spacer"></span>
            <label id="dupWrap" hidden><input type="checkbox" id="dupBox">Dodaj duplikat: Kask · Sty · 10</label>
        </div>
        <div class="caption" id="caption"></div>
        <div class="flow">
            <div>
                <h3 id="inTitle"></h3>
                <div id="in"></div>
            </div>
            <div class="arrow"><b>→</b><span id="fnName"></span></div>
            <div>
                <h3 id="outTitle"></h3>
                <div id="out"></div>
            </div>
        </div>
    </section>

    <div class="vz-grid" style="margin-top:16px">
        <section class="vz-card">
            <div class="vz-label">Co robi funkcja</div>
            <div class="vz-steps" id="steps"></div>
        </section>
        <div>
            <div class="vz-takeaway" id="takeaway" style="margin-top:0"></div>
        </div>
    </div>
</div>

<script src="../viz/kit.js"></script>
<script>
    // ================= Dane =================
    const MONTHS = ['Sty', 'Lut', 'Mar'];
    const WIDE = [
        { Produkt: 'Rower', Sty: 120, Lut: 90, Mar: 150 },
        { Produkt: 'Kask', Sty: 40, Lut: null, Mar: 55 },
        { Produkt: 'Bidon', Sty: 15, Lut: 20, Mar: 25 },
    ];
    const WIDE_COLS = ['Produkt', ...MONTHS];
    const DUP_ROW = { Produkt: 'Kask', 'Miesiąc': 'Sty', 'Wartość': 10 };

    // ================= Silnik M =================
    // Table.UnpivotOtherColumns(t, keep, attr, value): komórki null są pomijane
    function unpivotOtherColumns(rows, cols, keep, attr, value) {
        const out = [];
        rows.forEach((r, i) => cols.filter(c => !keep.includes(c)).forEach(c => {
            if (r[c] === null) return;
            const o = {};
            keep.forEach(k => { o[k] = r[k]; });
            o[attr] = c;
            o[value] = r[c];
            o.__src = { row: i, col: c };
            out.push(o);
        }));
        return out;
    }

    // Table.Pivot(t, values, attr, value, agg): wiersze = pozostałe kolumny, brak kombinacji = null
    function pivot(rows, values, attr, value, agg) {
        const keyCols = Object.keys(rows[0]).filter(c => c !== attr && c !== value && c !== '__src');
        const groups = [];
        rows.forEach(r => {
            let g = groups.find(x => keyCols.every(k => x.key[k] === r[k]));
            if (!g) { g = { key: Object.fromEntries(keyCols.map(k => [k, r[k]])), cells: {} }; groups.push(g); }
            (g.cells[r[attr]] = g.cells[r[attr]] || []).push(r[value]);
        });
        return groups.map(g => {
            const o = { ...g.key };
            values.forEach(v => { o[v] = g.cells[v] ? agg(g.cells[v]) : null; });
            return o;
        });
    }

    const listSum = l => { const n = l.filter(v => v !== null); return n.length ? n.reduce((a, b) => a + b, 0) : null; };
    const listDistinct = l => [...new Set(l)];

    // Table.Group(t, keys, aggs): każda agregacja dostaje podtabelę grupy jako _
    function group(rows, keys, aggs) {
        const groups = [];
        rows.forEach(r => {
            let g = groups.find(x => keys.every(k => x.key[k] === r[k]));
            if (!g) { g = { key: Object.fromEntries(keys.map(k => [k, r[k]])), rows: [] }; groups.push(g); }
            g.rows.push(r);
        });
        return groups.map(g => {
            const o = { ...g.key, __rows: g.rows };
            aggs.forEach(([name, fn]) => { o[name] = fn(g.rows); });
            return o;
        });
    }

    const LONG = unpivotOtherColumns(WIDE, WIDE_COLS, ['Produkt'], 'Miesiąc', 'Wartość');
    const LONG_COLS = ['Produkt', 'Miesiąc', 'Wartość'];

    // ================= Pomocnicze =================
    const nullHtml = '<span class="null">null</span>';
    const fmt = v => (v === null || v === undefined ? nullHtml : typeof v === 'number' ? VZ.fmt(v) : VZ.esc(v));
    const td = (id, html, cls = '', attr = 'src') => `<td class="${cls}" data-${attr}="${id}"><span class="v">${html}</span></td>`;
    const th = (id, html, cls = '', attr = 'src') => `<th class="${cls}" data-${attr}="${id}"><span class="v">${html}</span></th>`;
    const table = (head, body) => `<div class="vz-table-wrap"><table class="vz-table rt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    const pill = (txt, c) => `<span class="pill c-${c}">${VZ.esc(txt)}</span>`;
    const plForm = (n, one, few, many) => (n === 1 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? few : many);
    const plRows = n => `${n} ${plForm(n, 'wiersz', 'wiersze', 'wierszy')}`;

    // ================= Scenariusze =================
    // Każdy: code, moves [{ pairs: [[srcId, dstId, kolorKlasa]], caption, flash: dstId }], inHtml(pos), outHtml(pos)
    const SCEN = {};

    SCEN.unpivot = () => {
        const moves = [];
        const rowMove = {}; // indeks wiersza wyniku -> indeks ruchu
        let k = 0;
        WIDE.forEach((r, i) => MONTHS.forEach(m => {
            if (r[m] === null) {
                moves.push({ pairs: [], skip: `v:${i}:${m}`, caption: `${pill(r.Produkt + ' × ' + m, m)} = <span class="mono">null</span> → <b>pominięta</b>. Table.UnpivotOtherColumns nie tworzy wierszy z pustych komórek.` });
                return;
            }
            rowMove[k] = moves.length;
            moves.push({
                pairs: [[`p:${i}`, `o:${k}:Produkt`, `c-${r.Produkt}`], [`h:${m}`, `o:${k}:Miesiąc`, `c-${m}`], [`v:${i}:${m}`, `o:${k}:Wartość`, `c-${m}`]],
                src: [`p:${i}`, `h:${m}`, `v:${i}:${m}`],
                caption: `Komórka ${pill(r.Produkt + ' × ' + m, m)} = <b>${r[m]}</b> → nowy wiersz <span class="mono">${VZ.esc(r.Produkt)} | ${m} | ${r[m]}</span>`,
            });
            k++;
        }));
        return {
            fn: 'Table.UnpivotOtherColumns',
            code: `let\n    Źródło = Sprzedaż,\n    #"Anulowano przestawienie innych kolumn" = Table.UnpivotOtherColumns(Źródło, {{{visual|"Produkt"}}}, {{and|"Miesiąc"}}, {{row|"Wartość"}})\nin\n    #"Anulowano przestawienie innych kolumn"`,
            inTitle: `Przed: tabela szeroka <span class="vz-hint">${WIDE.length} × ${WIDE_COLS.length}</span>`,
            outTitle: `Po: tabela długa <span class="vz-hint">${plRows(LONG.length)}</span>`,
            moves,
            inHtml(pos) {
                const done = id => moves.slice(0, pos).some(mv => (mv.src || []).includes(id) || mv.skip === id);
                const act = id => pos > 0 && ((moves[pos - 1].src || []).includes(id) || moves[pos - 1].skip === id);
                const st = id => (act(id) ? ' active' : done(id) ? ' used' : '');
                const head = th('h:Produkt', 'Produkt', 'newcol') + MONTHS.map(m => th(`h:${m}`, m, `mc c-${m}${act(`h:${m}`) ? ' active' : ''}`)).join('');
                const body = WIDE.map((r, i) => '<tr>' + td(`p:${i}`, VZ.esc(r.Produkt), `c-${r.Produkt}${st(`p:${i}`)}`) + MONTHS.map(m => {
                    const id = `v:${i}:${m}`;
                    if (r[m] === null) return td(id, nullHtml + (done(id) ? '<span class="tag">pominięta</span>' : ''), `num nullcell${done(id) ? ' skip' : ''}${act(id) ? ' active' : ''}`);
                    return td(id, fmt(r[m]), `num val mc c-${m}${st(id)}`);
                }).join('') + '</tr>').join('');
                return table(head, body);
            },
            outHtml(pos) {
                const head = th('', 'Produkt', 'newcol', 'dst') + th('', 'Miesiąc<small>dawne nagłówki</small>', 'newcol', 'dst') + th('', 'Wartość<small>dawne komórki</small>', 'newcol num', 'dst');
                const body = LONG.map((r, k) => {
                    const show = rowMove[k] < pos;
                    const p = show ? '' : ' pend';
                    return `<tr class="${show ? '' : 'pend-row'}">` +
                        td(`o:${k}:Produkt`, VZ.esc(r.Produkt), p, 'dst') +
                        td(`o:${k}:Miesiąc`, r['Miesiąc'], `mc c-${r['Miesiąc']}${p}`, 'dst') +
                        td(`o:${k}:Wartość`, fmt(r['Wartość']), `num val mc c-${r['Miesiąc']}${p}`, 'dst') + '</tr>';
                }).join('');
                return table(head, body);
            },
            steps: () => `
                <div class="vz-step">
                    <div class="vz-step-title"><span class="vz-num" style="background:var(--ctx-visual)">1</span>Kolumny, które zostają bez zmian</div>
                    <div class="vz-chips">${VZ.chip('', 'Produkt', 'visual')}</div>
                    <div class="vz-step-note">Wszystkie <b>pozostałe</b> kolumny (${MONTHS.join(', ')}) zostaną rozpłaszczone. Gdy w źródle dojdzie kolumna Kwi, też się rozpłaszczy, bez zmiany kodu. Tym różni się od <code>Table.Unpivot</code>, które wymienia kolumny z nazwy.</div>
                </div>
                <div class="vz-step">
                    <div class="vz-step-title"><span class="vz-num" style="background:var(--ctx-and)">2</span>Nagłówek kolumny → wartość w kolumnie „Miesiąc”</div>
                    <div class="vz-chips">${MONTHS.map(m => `<span class="pill c-${m}" style="display:inline-block;border-radius:5px;padding:0 8px;font-weight:700;background:var(--ms);color:var(--mc)">${m}</span>`).join('')}</div>
                </div>
                <div class="vz-step">
                    <div class="vz-step-title"><span class="vz-num" style="background:var(--ctx-row)">3</span>Liczba z komórki → kolumna „Wartość”</div>
                    <div class="vz-step-note" style="margin-top:0">Każda komórka z liczbą daje jeden wiersz: produkt z jej wiersza, nazwa jej kolumny i jej wartość.</div>
                </div>
                <div class="vz-step">
                    <div class="vz-step-title"><span class="vz-num" style="background:var(--text)">4</span>Ile wierszy wychodzi</div>
                    <div class="vz-step-note" style="margin-top:0">${WIDE.length} produkty × ${MONTHS.length} miesiące = ${WIDE.length * MONTHS.length} komórek, z tego ${WIDE.length * MONTHS.length - LONG.length} null, który znika.</div>
                    <div class="vz-result"><span class="lbl">Wiersze wyniku</span><span class="val">${LONG.length}</span></div>
                </div>`,
            takeaway: () => 'Unpivot zamienia <b>nagłówki w dane</b>. Każda niepusta komórka staje się osobnym wierszem: Produkt zostaje, nazwa kolumny trafia do „Miesiąc”, liczba do „Wartość”. Komórka <b>null znika</b>, dlatego w wyniku nie ma wiersza Kask · Lut. Taki długi kształt to ten, którego potrzebuje model danych w Power BI.',
        };
    };

    SCEN.pivot = dup => {
        const input = dup ? [...LONG.map(r => ({ ...r })), { ...DUP_ROW }] : LONG.map(r => ({ ...r }));
        const values = listDistinct(input.map(r => r['Miesiąc']));
        const result = pivot(input, values, 'Miesiąc', 'Wartość', listSum);
        const prods = result.map(r => r.Produkt);
        const moves = [];
        const seenH = new Set(), seenP = new Set();
        const firstH = {}, firstP = {};
        input.forEach((r, k) => {
            const m = r['Miesiąc'], p = r.Produkt;
            const pairs = [[`l:${k}:Wartość`, `w:${p}:${m}`, `c-${m}`]];
            const src = [`l:${k}:Wartość`];
            if (!seenH.has(m)) { seenH.add(m); firstH[m] = moves.length; pairs.push([`l:${k}:Miesiąc`, `wh:${m}`, `c-${m}`]); src.push(`l:${k}:Miesiąc`); }
            if (!seenP.has(p)) { seenP.add(p); firstP[p] = moves.length; pairs.push([`l:${k}:Produkt`, `wp:${p}`, `c-${p}`]); src.push(`l:${k}:Produkt`); }
            const before = input.slice(0, k).filter(x => x.Produkt === p && x['Miesiąc'] === m).map(x => x['Wartość']);
            const caption = before.length
                ? `${pill(p + ' × ' + m, m)} ma już ${before.join(' + ')}, przychodzi <b>${r['Wartość']}</b> → List.Sum: <b>${[...before, r['Wartość']].join(' + ')} = ${listSum([...before, r['Wartość']])}</b>`
                : `Wiersz <span class="mono">${VZ.esc(p)} | ${m} | ${r['Wartość']}</span> → wiersz ${VZ.esc(p)}, kolumna ${pill(m, m)}${pairs.length > 1 && firstH[m] === moves.length ? ' (nowy nagłówek)' : ''}`;
            moves.push({ pairs, src, caption, k });
        });
        const holes = [];
        result.forEach(r => values.forEach(v => { if (r[v] === null) holes.push([r.Produkt, v]); }));
        if (holes.length) moves.push({ pairs: [], src: [], holes: true, caption: holes.map(([p, v]) => `${pill(p + ' × ' + v, v)}`).join(', ') + ': w danych nie ma takiego wiersza → komórka dostaje <b>null</b> (nie 0).' });
        const valMoves = (p, m) => moves.map((mv, i) => [mv, i]).filter(([mv]) => mv.pairs.some(x => x[1] === `w:${p}:${m}`)).map(([, i]) => i);

        return {
            fn: 'Table.Pivot',
            code: `let\n    Źródło = #"Anulowano przestawienie innych kolumn",\n    #"Kolumna przestawna" = Table.Pivot(Źródło, List.Distinct(Źródło[Miesiąc]), {{and|"Miesiąc"}}, {{row|"Wartość"}}, {{calc|List.Sum}})\nin\n    #"Kolumna przestawna"`,
            inTitle: `Przed: tabela długa <span class="vz-hint">${plRows(input.length)}</span>`,
            outTitle: `Po: tabela szeroka <span class="vz-hint">${result.length} × ${values.length + 1}</span>`,
            moves,
            inHtml(pos) {
                const cur = pos > 0 ? moves[pos - 1] : null;
                const done = id => moves.slice(0, pos).some(mv => mv.src.includes(id));
                const st = id => (cur && cur.src.includes(id) ? ' active' : done(id) ? ' used' : '');
                const head = LONG_COLS.map(c => th('', c, c === 'Wartość' ? 'num' : '')).join('');
                const body = input.map((r, k) => `<tr${dup && k === input.length - 1 ? ' style="font-style:italic"' : ''}>` +
                    td(`l:${k}:Produkt`, VZ.esc(r.Produkt), `c-${r.Produkt}${st(`l:${k}:Produkt`)}`) +
                    td(`l:${k}:Miesiąc`, r['Miesiąc'], `mc c-${r['Miesiąc']}${st(`l:${k}:Miesiąc`)}`) +
                    td(`l:${k}:Wartość`, fmt(r['Wartość']) + (dup && k === input.length - 1 ? '<span class="tag" style="color:var(--ctx-calc)">duplikat</span>' : ''), `num val mc c-${r['Miesiąc']}${st(`l:${k}:Wartość`)}`) + '</tr>').join('');
                return table(head, body);
            },
            outHtml(pos) {
                const head = th('', 'Produkt', 'newcol', 'dst') + values.map(m => th(`wh:${m}`, m, `mc c-${m}${firstH[m] < pos ? '' : ' pend'}`, 'dst')).join('');
                const holesOn = moves[pos - 1] && moves[pos - 1].holes;
                const body = prods.map(p => {
                    const rowOn = firstP[p] < pos;
                    return `<tr class="${rowOn ? '' : 'pend-row'}">` + td(`wp:${p}`, VZ.esc(p), rowOn ? '' : 'pend', 'dst') + values.map(m => {
                        const got = valMoves(p, m).filter(i => i < pos).map(i => input[moves[i].k]['Wartość']);
                        if (!got.length) {
                            const end = pos >= moves.length;
                            return td(`w:${p}:${m}`, nullHtml, `num nullcell${end ? '' : ' pend'}${holesOn ? ' active' : ''}`, 'dst');
                        }
                        const sub = got.length > 1 ? `<span class="sub">${got.join(' + ')}</span>` : '';
                        return td(`w:${p}:${m}`, sub + fmt(listSum(got)), `num val mc c-${m}`, 'dst');
                    }).join('') + '</tr>';
                }).join('');
                return table(head, body);
            },
            steps: () => `
                <div class="vz-step">
                    <div class="vz-step-title"><span class="vz-num" style="background:var(--ctx-and)">1</span>Skąd nowe nagłówki: kolumna „Miesiąc”</div>
                    <div class="vz-chips">${VZ.chip('List.Distinct(Źródło[Miesiąc])', '{' + values.map(v => `"${v}"`).join(', ') + '}', 'and')}</div>
                    <div class="vz-step-note">Każda unikalna wartość staje się kolumną, w kolejności pierwszego wystąpienia.</div>
                </div>
                <div class="vz-step">
                    <div class="vz-step-title"><span class="vz-num" style="background:var(--ctx-visual)">2</span>Co wyznacza wiersze</div>
                    <div class="vz-chips">${VZ.chip('', 'Produkt', 'visual')}</div>
                    <div class="vz-step-note">Wszystkie kolumny poza „Miesiąc” i „Wartość”. Tu tylko Produkt, więc wychodzą ${plRows(result.length)}.</div>
                </div>
                <div class="vz-step">
                    <div class="vz-step-title"><span class="vz-num" style="background:var(--ctx-calc)">3</span>Co gdy w komórce spotka się kilka wartości</div>
                    <div class="vz-chips">${VZ.chip('agregacja', 'List.Sum', 'calc')}</div>
                    <div class="vz-step-note">${dup
                        ? 'Kask × Sty ma teraz dwa wiersze (40 i 10), więc List.Sum je dodaje: <b>50</b>.'
                        : 'Tu każda kombinacja Produkt × Miesiąc występuje raz, więc List.Sum niczego nie łączy. Włącz duplikat powyżej, żeby to zobaczyć.'}
                        Bez piątego argumentu („Nie agreguj”) duplikat kończy się błędem <code>Expression.Error</code>: za dużo elementów w wyliczeniu.</div>
                </div>
                <div class="vz-step">
                    <div class="vz-step-title"><span class="vz-num" style="background:var(--text)">4</span>Brakujące kombinacje</div>
                    <div class="vz-step-note" style="margin-top:0">${holes.length ? holes.map(([p, v]) => `${p} × ${v}`).join(', ') + ': brak wiersza w danych, więc komórka ma <b>null</b>.' : 'Wszystkie kombinacje mają wartość.'}</div>
                    <div class="vz-result"><span class="lbl">Wynik</span><span class="val">${result.length} × ${values.length + 1}</span></div>
                </div>`,
            takeaway: () => dup
                ? 'Pivot <b>łączy</b> wiersze o tej samej kombinacji Produkt × Miesiąc funkcją z piątego argumentu. Kask × Sty: 40 + 10 = <b>50</b>. Gdy danych może być więcej niż jeden wiersz na komórkę, agregacja jest obowiązkowa.'
                : 'Pivot to <b>odwrotność unpivot</b>: wartości z kolumny „Miesiąc” stają się nagłówkami, a „Wartość” wypełnia komórki. Kombinacja, której nie ma w danych (Kask × Lut), dostaje <b>null</b>, a nie 0. Tak wraca dokładnie tabela, od której zaczął unpivot.',
        };
    };

    SCEN.group = () => {
        const result = group(LONG, ['Produkt'], [
            ['Suma', g => listSum(g.map(r => r['Wartość']))],
            ['Liczba', g => g.length],
        ]);
        const moves = [];
        const firstP = {};
        const chipIdx = {}; // k -> pozycja w grupie
        LONG.forEach((r, k) => {
            const p = r.Produkt;
            const g = LONG.slice(0, k + 1).filter(x => x.Produkt === p);
            chipIdx[k] = g.length - 1;
            const pairs = [[`l:${k}:Wartość`, `g:${p}:chip:${k}`, `c-${p}`]];
            const src = [`l:${k}:Wartość`, `l:${k}:Produkt`];
            if (firstP[p] === undefined) { firstP[p] = moves.length; pairs.push([`l:${k}:Produkt`, `g:${p}`, `c-${p}`]); }
            moves.push({
                pairs, src, k,
                caption: `Wiersz <span class="mono">${VZ.esc(p)} | ${r['Miesiąc']} | ${r['Wartość']}</span> → grupa ${pill(p, p)}${g.length === 1 ? ' (nowa grupa)' : ''}. Suma: <b>${g.map(x => x['Wartość']).join(' + ')} = ${listSum(g.map(x => x['Wartość']))}</b>, wierszy: <b>${g.length}</b>`,
            });
        });
        return {
            fn: 'Table.Group',
            code: `let\n    Źródło = #"Anulowano przestawienie innych kolumn",\n    #"Pogrupowano wiersze" = Table.Group(Źródło, {{{visual|"Produkt"}}}, {{"Suma", {{row|each List.Sum([Wartość])}}, type nullable number}, {"Liczba", {{row|each Table.RowCount(_)}}, Int64.Type}})\nin\n    #"Pogrupowano wiersze"`,
            inTitle: `Przed: tabela długa <span class="vz-hint">${plRows(LONG.length)}</span>`,
            outTitle: `Po: jeden wiersz na grupę <span class="vz-hint">${plRows(result.length)}</span>`,
            moves,
            inHtml(pos) {
                const cur = pos > 0 ? moves[pos - 1] : null;
                const done = id => moves.slice(0, pos).some(mv => mv.src.includes(id));
                const st = id => (cur && cur.src.includes(id) ? ' active' : done(id) ? ' used' : '');
                const head = LONG_COLS.map(c => th('', c, c === 'Wartość' ? 'num' : '')).join('');
                const body = LONG.map((r, k) => '<tr>' +
                    td(`l:${k}:Produkt`, VZ.esc(r.Produkt), `mc c-${r.Produkt}${st(`l:${k}:Produkt`)}`) +
                    td(`l:${k}:Miesiąc`, r['Miesiąc'], st(`l:${k}:Miesiąc`).replace('active', '')) +
                    td(`l:${k}:Wartość`, fmt(r['Wartość']), `num val mc c-${r.Produkt}${st(`l:${k}:Wartość`)}`) + '</tr>').join('');
                return table(head, body);
            },
            outHtml(pos) {
                const cur = pos > 0 ? moves[pos - 1] : null;
                const head = th('', 'Produkt', 'newcol', 'dst') + th('', '_ = podtabela', 'sub-col', 'dst') + th('', 'Suma<small>List.Sum([Wartość])</small>', 'newcol num', 'dst') + th('', 'Liczba<small>Table.RowCount(_)</small>', 'newcol num', 'dst');
                const body = result.map(g => {
                    const p = g.Produkt;
                    const on = firstP[p] < pos;
                    const ks = LONG.map((r, k) => [r, k]).filter(([r, k]) => r.Produkt === p && moves.findIndex(mv => mv.k === k) < pos);
                    const vals = ks.map(([r]) => r['Wartość']);
                    const hot = cur && LONG[cur.k].Produkt === p ? ' flash' : '';
                    const chips = `<span class="grp-chips">${ks.map(([r, k]) => `<span class="v c-${p}" data-dst="g:${p}:chip:${k}">${r['Wartość']}</span>`).join('')}</span>`;
                    return `<tr class="${on ? '' : 'pend-row'}">` +
                        td(`g:${p}`, VZ.esc(p), `mc c-${p}${on ? '' : ' pend'}`, 'dst') +
                        `<td class="sub-col c-${p}">${chips}</td>` +
                        td(`g:${p}:sum`, vals.length ? fmt(listSum(vals)) : '', `num val c-${p}${on ? '' : ' pend'}${hot}`, 'dst') +
                        td(`g:${p}:cnt`, String(vals.length), `num val c-${p}${on ? '' : ' pend'}${hot}`, 'dst') + '</tr>';
                }).join('');
                return table(head, body);
            },
            steps: () => {
                const g0 = result[0];
                return `
                <div class="vz-step">
                    <div class="vz-step-title"><span class="vz-num" style="background:var(--ctx-visual)">1</span>Klucz grupowania</div>
                    <div class="vz-chips">${VZ.chip('', 'Produkt', 'visual')}${VZ.op('→', 'arrow')}${result.map(r => VZ.chip('', r.Produkt, 'none')).join('')}</div>
                    <div class="vz-step-note">Wiersze o tej samej wartości klucza trafiają do jednej grupy. ${plRows(LONG.length)} → ${result.length} grupy.</div>
                </div>
                <div class="vz-step">
                    <div class="vz-step-title"><span class="vz-num" style="background:var(--ctx-row)">2</span><span>W grupowaniu <code>_</code> to cała podtabela, nie wiersz</span></div>
                    <div class="vz-step-note" style="margin-top:0">Każda agregacja to funkcja <code>each</code>, która dostaje <b>wszystkie wiersze grupy</b>. Dla grupy ${g0.Produkt}:</div>
                    <div class="list-eq">
                        <span>_[Wartość] = {${g0.__rows.map(r => r['Wartość']).join(', ')}}  ← lista, nie liczba</span>
                        <span>List.Sum(_[Wartość]) = ${g0.Suma}</span>
                        <span>Table.RowCount(_) = ${g0.Liczba}</span>
                    </div>
                </div>
                <div class="vz-step">
                    <div class="vz-step-title"><span class="vz-num" style="background:var(--ctx-calc)">3</span>Każda agregacja = nowa kolumna</div>
                    <div class="vz-chips">${VZ.chip('Suma', 'List.Sum', 'calc')}${VZ.chip('Liczba', 'Table.RowCount', 'calc')}</div>
                    <div class="vz-step-note">Kolumny spoza klucza i agregacji (tu Miesiąc) znikają z wyniku.</div>
                </div>
                <div class="vz-step">
                    <div class="vz-step-title"><span class="vz-num" style="background:var(--text)">4</span>Wynik</div>
                    <div class="vz-step-note" style="margin-top:0">${result.map(r => `${r.Produkt}: ${r.__rows.map(x => x['Wartość']).join(' + ')} = ${r.Suma}`).join(' · ')}</div>
                    <div class="vz-result"><span class="lbl">Wiersze wyniku</span><span class="val">${result.length}</span></div>
                </div>`;
            },
            takeaway: () => `Table.Group <b>zwija</b> wiersze o tym samym kluczu w jeden. W grupowaniu <code>each</code> dostaje całą <b>podtabelę grupy</b>, więc <code>[Wartość]</code> to lista, np. {${result[0].__rows.map(r => r['Wartość']).join(', ')}}, a nie jedna liczba. Kask ma tylko ${result.find(r => r.Produkt === 'Kask').Liczba} wiersze, bo null z lutego zniknął już przy unpivot.`,
        };
    };

    // ================= Animacja =================
    const state = { scen: 'unpivot', dup: false, pos: 0 };
    let S = null;
    let timer = null;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function fly(srcEl, dstEl, cls) {
        const a = srcEl.getBoundingClientRect();
        const b = dstEl.getBoundingClientRect();
        const g = document.createElement('div');
        g.className = 'ghost ' + cls;
        g.innerHTML = srcEl.querySelector('.v') ? srcEl.querySelector('.v').innerHTML.replace(/<span class="tag"[\s\S]*?<\/span>/, '') : srcEl.innerHTML;
        Object.assign(g.style, { left: a.left + scrollX + 'px', top: a.top + scrollY + 'px', width: a.width + 'px', height: a.height + 'px' });
        document.body.appendChild(g);
        dstEl.classList.add('landing');
        requestAnimationFrame(() => requestAnimationFrame(() => {
            g.style.transform = `translate(${b.left - a.left}px, ${b.top - a.top}px)`;
            g.style.width = b.width + 'px';
            g.style.height = b.height + 'px';
        }));
        setTimeout(() => { dstEl.classList.remove('landing'); g.style.opacity = '0'; }, 640);
        setTimeout(() => g.remove(), 860);
    }

    function draw(animate) {
        const pos = state.pos;
        document.getElementById('in').innerHTML = S.inHtml(pos);
        document.getElementById('out').innerHTML = S.outHtml(pos);
        document.getElementById('count').textContent = `Krok ${pos} z ${S.moves.length}`;
        document.getElementById('prevBtn').disabled = pos === 0;
        document.getElementById('nextBtn').disabled = pos >= S.moves.length;
        document.getElementById('endBtn').disabled = pos >= S.moves.length;
        document.getElementById('caption').innerHTML = pos === 0
            ? `Kliknij <b>▶ Odtwórz</b> albo <b>→</b>, żeby przenosić komórki po jednej.`
            : S.moves[pos - 1].caption;
        if (animate && !reduce && pos > 0) {
            document.querySelectorAll('.ghost').forEach(g => g.remove());
            S.moves[pos - 1].pairs.forEach(([src, dst, cls]) => {
                const s = document.querySelector(`#in [data-src="${src}"]`);
                const d = document.querySelector(`#out [data-dst="${dst}"]`);
                if (s && d) fly(s, d, cls);
            });
        }
    }

    function stop() { clearTimeout(timer); timer = null; document.getElementById('playBtn').textContent = '▶ Odtwórz'; }

    function play() {
        if (timer) { stop(); return; }
        if (state.pos >= S.moves.length) { state.pos = 0; draw(false); }
        document.getElementById('playBtn').textContent = '❚❚ Pauza';
        const tick = () => {
            if (state.pos >= S.moves.length) { stop(); return; }
            state.pos++;
            draw(true);
            timer = setTimeout(tick, state.pos >= S.moves.length ? 0 : 900);
        };
        timer = setTimeout(tick, 250);
    }

    function load(autoplay) {
        stop();
        S = SCEN[state.scen](state.dup);
        document.getElementById('code').innerHTML = VZ.code(S.code);
        document.getElementById('fnName').textContent = S.fn;
        document.getElementById('inTitle').innerHTML = S.inTitle;
        document.getElementById('outTitle').innerHTML = S.outTitle;
        document.getElementById('dupWrap').hidden = state.scen !== 'pivot';
        document.getElementById('steps').innerHTML = S.steps();
        document.getElementById('takeaway').innerHTML = S.takeaway();
        VZ.reveal(document.getElementById('steps'));
        state.pos = reduce ? S.moves.length : 0;
        draw(false);
        if (autoplay && !reduce) play();
    }

    document.getElementById('playBtn').addEventListener('click', play);
    document.getElementById('prevBtn').addEventListener('click', () => { stop(); state.pos = Math.max(0, state.pos - 1); draw(false); });
    document.getElementById('nextBtn').addEventListener('click', () => { stop(); state.pos = Math.min(S.moves.length, state.pos + 1); draw(true); });
    document.getElementById('endBtn').addEventListener('click', () => { stop(); state.pos = S.moves.length; draw(false); });
    document.getElementById('dupBox').addEventListener('change', e => { state.dup = e.target.checked; load(false); state.pos = S.moves.length; draw(false); });

    VZ.tabs(document.getElementById('tabs'), [
        { id: 'unpivot', label: 'Unpivot · anuluj przestawienie' },
        { id: 'pivot', label: 'Pivot · kolumna przestawna' },
        { id: 'group', label: 'Grupowanie · Group By' },
    ], id => { state.scen = id; load(true); }, state.scen);

    load(true);
</script>
</body>
</html>
