<!-- About Me Section: life outside work -->
<section id="me" class="content-section">
    <h2 class="section-header" data-i18n="me.title">About me</h2>
    <p class="section-subtitle" data-i18n="me.subtitle"></p>

    <div class="me-intro">
        <p data-i18n="me.intro.p1"></p>
        <p data-i18n="me.intro.p2"></p>
    </div>

    <!-- 01: space — the cursor is a black hole that lenses the star field -->
    <article class="me-segment me-space" data-cursor="hole">
        <canvas class="me-canvas" aria-hidden="true"></canvas>
        <div class="me-segment-body">
            <h3 class="me-segment-title" data-i18n="me.space.title"></h3>
            <p data-i18n="me.space.p1"></p>
            <p data-i18n="me.space.p2"></p>
        </div>
        <span class="me-hint" data-i18n="me.space.hint"></span>
    </article>

    <!-- 02: stories — a small canvas beside the text; the cursor is a Clair Obscur brush whose light scatters into petals -->
    <article class="me-segment me-stories">
        <div class="me-stage" data-cursor="brush">
            <canvas class="me-canvas" aria-hidden="true"></canvas>
            <span class="me-stage-hint" data-i18n="me.stories.hint"></span>
        </div>
        <div class="me-segment-body">
            <h3 class="me-segment-title" data-i18n="me.stories.title"></h3>
            <p data-i18n="me.stories.p1"></p>
        </div>
    </article>

    <!-- 03: gravel — moving over the photo leaves a faint unicycle tyre track -->
    <article class="me-segment me-gravel">
        <div class="me-segment-body">
            <h3 class="me-segment-title" data-i18n="me.gravel.title"></h3>
            <p data-i18n="me.gravel.p1"></p>
            <p data-i18n="me.gravel.p2"></p>
        </div>
        <figure class="me-gravel-media">
            <canvas class="me-canvas" aria-hidden="true"></canvas>
            <img src="static/me/gravel.webp?v=2" alt="" data-i18n-alt="me.gravel.alt" loading="lazy" width="1600" height="1200">
        </figure>
    </article>

    <!-- Closing: the crane and Bisz -->
    <div class="me-closing">
        <figure class="me-closing-media">
            <img src="static/me/crane.webp" alt="" data-i18n-alt="me.craneAlt" loading="lazy" width="1100" height="813">
        </figure>
        <blockquote class="me-quote">
            <div class="me-quote-lines" id="me-quote-lines"></div>
            <cite>Bisz</cite>
        </blockquote>
    </div>
</section>
