<!-- Journey Section -->
<section id="journey" class="content-section">
    <div class="timeline-app-container">
        <div class="timeline-header">
            <h2 class="section-header" data-i18n="journey.title">Journey</h2>
            <p class="section-subtitle" data-i18n="journey.subtitle"></p>
        </div>

        <!-- Główna zawartość -->
        <div class="timeline-main-content">
            <!-- Nawigacja -->
            <div class="timeline-navigation">
                <button class="timeline-nav-button" id="timeline-prev-btn" aria-label="Previous event">‹</button>
                <button class="timeline-nav-button" id="timeline-next-btn" aria-label="Next event">›</button>
            </div>

            <!-- Panel lewy -->
            <div class="timeline-right-panel">
                <div id="timeline-left-content">
                    <div class="timeline-loading" data-i18n="journey.loading">Loading…</div>
                </div>
            </div>

            <!-- Panel prawy -->
            <div class="timeline-left-panel">
                <div id="timeline-right-content"></div>
            </div>

            <div class="tl-mnav tl-mnav-bottom">
                <button type="button" class="tl-mnav-prev" aria-label="Previous">‹</button>
                <span class="tl-mnav-count"></span>
                <button type="button" class="tl-mnav-next" aria-label="Next">›</button>
            </div>
        </div>

        <!-- Oś czasu -->
        <div class="timeline-container">
            <div class="timeline-wrapper">
                <div class="timeline">
                    <div id="timeline-items"></div>
                </div>
            </div>
        </div>

        <!-- Mobile: step through events -->
        <div class="tl-mnav tl-mnav-top">
            <button type="button" class="tl-mnav-prev" aria-label="Previous">‹</button>
            <span class="tl-mnav-count"></span>
            <button type="button" class="tl-mnav-next" aria-label="Next">›</button>
        </div>
    </div>
</section>
